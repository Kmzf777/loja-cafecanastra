# Deploy automatico na VPS (loja.canastrainteligencia.com).
#
# GATILHO: o fim do workflow `ci`, e so quando ele passou EM main. Nao roda a
# suite de novo de proposito — ci.yml ja roda backend + frontend + next build em
# ~8 min; repetir aqui dobraria o tempo de todo push sem descobrir nada novo.
# O preco e a regra do `if` abaixo, que precisa checar branch E conclusao: o
# evento workflow_run dispara para QUALQUER branch e para falha tambem.
#
# workflow_dispatch fica como valvula de escape: redeploy manual sem commit
# (util depois de trocar um segredo em backend/src/.env, por exemplo).
#
# O QUE ESTE WORKFLOW NAO FAZ: build no runner. As imagens sao construidas na
# propria VPS porque nao ha registry de container aqui — empurrar 465 MB de
# imagem por SSH a cada push seria mais lento que reconstruir com cache local.

name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

# Um deploy por vez. cancel-in-progress FALSE: matar um deploy no meio de um
# `docker stack deploy` deixa o swarm em estado parcial — melhor enfileirar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          # O next build sozinho passa de 10 min nesta VPS (3 vCPU).
          command_timeout: 35m
          # UMA LINHA, E ISSO E O PONTO. O drone-ssh, com script_stop:true,
          # quebra o `script` por \n e injeta depois de CADA linha uma
          # conferencia cega de `$?` que encerra o deploy a qualquer status
          # != 0 (drone-ssh plugin.go, funcao commands()). Isso derruba
          # construcoes corretas de shell — `[ a = b ] && x=1`, `if [ -f x ]`,
          # `grep -q` — e foi o que manteve TODA execucao deste workflow
          # vermelha entre d6a0b8f e 2026-08-25. Com uma linha so, ha uma
          # unica conferencia: a do script inteiro, que e a que se quer.
          # A logica vive em deploy/deploy.sh, versionada e testavel com
          # `bash -n`. NAO volte a colocar um script multilinha aqui.
          script: bash /srv/loja-cafecanastra/deploy/deploy.sh "${{ github.event_name }}"
