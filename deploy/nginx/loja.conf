# Proxy reverso da loja — vitrine e API na MESMA origem (docs/producao.md §2).
#
#   https://loja.exemplo.com.br/        -> web (Next standalone, porta 3000)
#   https://loja.exemplo.com.br/api/*   -> api (Express, porta 3333, SEM o /api)
#
# É essa topologia que faz cookie ser first-party e enterra a dupla
# `SameSite=None` + CORS entre domínios que quebrava o deploy antigo em
# silêncio. O Supabase/Kong fica em domínio PRÓPRIO (bloco comentado no fim).
#
# ANTES DE USAR: troque loja.exemplo.com.br pelo domínio real (4 ocorrências)
# e emita o certificado (bloco TLS abaixo diz como). Teste com:
#   docker compose -f docker-compose.prod.yml exec nginx nginx -t
#
# SEM DOCKER (PM2 + nginx do sistema): este mesmo arquivo serve. Copie para
# /etc/nginx/conf.d/, e troque os upstreams `api:3333` e `web:3000` por
# `127.0.0.1:3333` e `127.0.0.1:3000` — os nomes `api` e `web` só existem na
# rede interna do compose.

# Websocket: o header Connection precisa virar "upgrade" só quando o cliente
# pediu upgrade — senão keep-alive normal. (Next usa websocket no dev/HMR e é
# o caminho para live features futuras; custa nada e evita um 502 misterioso.)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── HTTP: só desafio do certbot e redirect para HTTPS ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name loja.exemplo.com.br;

    # CERTBOT ENTRA AQUI (desafio HTTP-01 por webroot). Emitir/renovar, do host:
    #   certbot certonly --webroot -w /var/lib/docker/volumes/canastra_certbot-webroot/_data \
    #     -d loja.exemplo.com.br
    # (No caminho sem Docker: -w /var/www/certbot e crie a pasta.)
    # A renovação automática do certbot roda sozinha; depois de renovar,
    # recarregue o nginx: docker compose ... exec nginx nginx -s reload
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: a loja ───────────────────────────────────────────────────────────
server {
    # `listen ... http2` e nao `http2 on;`: a diretiva nova so existe no nginx
    # >= 1.25.1 — o container nginx:1.27 tem, mas o nginx de sistema de um
    # Ubuntu LTS (caminho PM2) ainda nao. A forma antiga funciona nos dois
    # (no novo, com um aviso de deprecated no log, que e o custo certo).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loja.exemplo.com.br;

    # Certificados emitidos pelo certbot (montados de /etc/letsencrypt).
    ssl_certificate     /etc/letsencrypt/live/loja.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loja.exemplo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:loja_ssl:10m;

    # Upload de imagem do painel: o multer aceita 5 MB por arquivo; 6m cobre o
    # arquivo + overhead do multipart. O padrão do nginx (1m) derrubaria todo
    # upload com um 413 que o painel mostraria como erro genérico. Se um dia o
    # formulário de config mandar DOIS banners de 5 MB na mesma requisição,
    # suba para 11m — este é o lugar.
    client_max_body_size 6m;

    # Gzip do que é texto. Imagem/binário já vem comprimido, não entra.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/rss+xml image/svg+xml text/plain text/xml;

    # Cabeçalhos que os dois upstreams precisam receber em toda rota:
    #  - Host: o Next monta URL absoluta com ele;
    #  - X-Forwarded-For: o Express tem `trust proxy` ligado e o rate limit
    #    conta por IP — sem isto, todo cliente vira o IP do nginx e o limite
    #    de frete/webhook derruba gente inocente;
    #  - X-Forwarded-Proto: é o que diz ao app que a ponta é https.
    #
    # ATENÇÃO à herança do nginx: um location que declare QUALQUER
    # proxy_set_header próprio descarta TODOS os herdados do server. Por isso o
    # `location /` (que precisa dos headers de websocket) repete a lista
    # inteira, e o `location /api/` (que não declara nenhum) herda daqui.
    # Acrescentou um header? Acrescente NOS DOIS lugares.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;

    # A API, sob /api/*. A barra no fim do proxy_pass REMOVE o prefixo:
    #   /api/health              -> http://api:3333/health
    #   /api/webhook/mercadopago -> http://api:3333/webhook/mercadopago
    # O Express não conhece "/api" — quem o inventa e o remove é este bloco.
    # (WEBHOOK_URL do Mercado Pago, portanto, é
    #  https://loja.exemplo.com.br/api/webhook/mercadopago.)
    location /api/ {
        proxy_pass http://api:3333/;
        proxy_read_timeout 60s;
    }

    # Todo o resto é a vitrine/painel Next, com upgrade de websocket.
    location / {
        proxy_pass http://web:3000;
        # A lista repetida do server (ver o aviso de herança lá em cima) + os
        # dois de websocket:
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

